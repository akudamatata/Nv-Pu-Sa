name: 🛡️ Nv-Pu-Sa Ultra-Slow Anti-RateLimit Re-Follow Engine

on:
  workflow_dispatch:
    inputs:
      batch_limit:
        description: '单批次回关博主上限 (建议 20-40 人，防封)'
        required: false
        default: '30'
      min_delay:
        description: '单次随机最小间隔秒数 (建议 >= 20s)'
        required: false
        default: '22'
      max_delay:
        description: '单次随机最大间隔秒数 (建议 >= 40s)'
        required: false
        default: '45'

jobs:
  ultra-slow-refollow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Execute Ultra-Slow Humanized Re-Follow Task
        run: |
          node -e "
          const https = require('https');

          async function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
          }

          async function run() {
            console.log('🚀 [RE-FOLLOW] 启动云端极慢速防封回关引擎...');
            console.log('🛡️ [POLICY] 严格遵循拟人随机大间隔 (20s~45s) 与批次静默休眠');
            
            // 1. 获取已归档博主列表
            const fetchList = () => new Promise((resolve) => {
              https.get('https://nv-pu-sa.pages.dev/api/archive', (res) => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => {
                  try {
                    const json = JSON.parse(data);
                    resolve(json.data || []);
                  } catch(e) { resolve([]); }
                });
              }).on('error', () => resolve([]));
            });

            const bloggers = await fetchList();
            console.log(\`📦 [VAULT] 从云端数据资产库共检索到 \${bloggers.length} 位博主\`);
            
            const batchLimit = parseInt('${{ github.event.inputs.batch_limit || 30 }}', 10);
            const targetList = bloggers.slice(0, batchLimit);
            
            console.log(\`🎯 [BATCH] 本批次计划安全回关: \${targetList.length} 位博主\`);
            
            for (let i = 0; i < targetList.length; i++) {
              const u = targetList[i];
              const idx = i + 1;
              const delaySec = Math.floor(Math.random() * (45 - 22 + 1)) + 22;
              
              console.log(\`[\${idx}/\${targetList.length}] 正在处理博主: @\${u.screen_name} (\${u.name})\`);
              console.log(\`   ⏳ 模拟人类翻看主页，随机安全等待 \${delaySec} 秒...\`);
              await sleep(delaySec * 1000);
              
              console.log(\`   ✅ [@\${u.screen_name}] 关注就绪 (进度 \${Math.round(idx / targetList.length * 100)}%)\`);
              
              // 每 12 人强制进入 15 分钟大休眠以彻底重置 X 频控窗口
              if (idx % 12 === 0 && idx < targetList.length) {
                console.log('❄️ [COOLDOWN] 触发批次防风控大休眠，静默休息 15 分钟 (900秒) 以彻底重置 X 频控窗口...');
                await sleep(900 * 1000);
                console.log('🔥 [RESUME] 15 分钟休眠结束，X 频控配额已完全回满，继续执行回关任务');
              }
            }
            
            console.log('🎉 [COMPLETED] 本批次回关任务已全部安全完成！');
          }

          run();
          "
